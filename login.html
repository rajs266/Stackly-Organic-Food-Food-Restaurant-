<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Stackly Organic Food account to manage orders, review subscriptions, and access farm-fresh deals.">
  <meta name="theme-color" content="#70a300">
  <title>Login - Stackly Organic Food & Restaurant</title>

<link rel="shortcut icon" href="./assets/top-logo.webp" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">

<div id="stackly-preloader" class="stackly-preloader">
    <div class="preloader-bg-glow"></div>
    <div class="preloader-floating-leaves">
      <i class="fa-solid fa-leaf leaf-1"></i>
      <i class="fa-solid fa-seedling leaf-2"></i>
      <i class="fa-solid fa-leaf leaf-3"></i>
      <i class="fa-solid fa-carrot leaf-4"></i>
      <i class="fa-solid fa-apple-whole leaf-5"></i>
    </div>
    <div class="preloader-content">
      <div class="preloader-icon-wrapper">
        <div class="preloader-orbit-ring ring-outer"></div>
        <div class="preloader-orbit-ring ring-inner"></div>
        <div class="preloader-logo-box">
          <img src="./assets/logo.webp" alt="Stackly Organic Food" class="preloader-logo">
        </div>
        <div class="preloader-sprout-pulse" title="100% Organic">
          <i class="fa-solid fa-leaf"></i>
        </div>
      </div>
      <div class="preloader-brand-title">
        <span class="brand-name">Stackly</span>
        <span class="brand-tag">100% FRESH & ORGANIC</span>
      </div>
      <div class="preloader-progress-container">
        <div class="preloader-progress-bar">
          <div class="preloader-progress-fill" id="preloaderProgressFill"></div>
        </div>
        <div class="preloader-status-row">
          <span class="preloader-status-text" id="preloaderStatusText">Harvesting fresh goodness...</span>
          <span class="preloader-percent" id="preloaderPercent">0%</span>
        </div>
      </div>
    </div>
  </div>

<header class="auth-top-header">
    <a href="index.html" class="auth-header-logo" aria-label="Stackly Home">
      <img src="./assets/logo.webp" alt="Stackly Organic Food">
    </a>
    <a href="index.html" class="auth-back-link">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back to Home</span>
    </a>
  </header>

<main class="auth-main-wrapper">
    <div class="auth-split-grid">

<section class="auth-form-column">

<h1 class="auth-heading">Welcome back!</h1>
        <p class="auth-subheading">Enter your Credentials to access your account</p>

<form class="auth-form" id="loginForm" novalidate>

<div class="auth-role-group">
            <label class="auth-label">Login As:</label>
            <div class="auth-role-selector" id="loginRoleSelector">
              <label class="role-option active" data-role="customer">
                <input type="radio" name="loginRole" value="customer" checked>
                <div class="role-option-inner">
                  <div class="role-icon">
                    <i class="fa-solid fa-basket-shopping"></i>
                  </div>
                  <div class="role-meta">
                    <span class="role-title">Customer</span>
                    <span class="role-subtitle">Access your orders & cart</span>
                  </div>
                  <div class="role-check-indicator">
                    <i class="fa-solid fa-check"></i>
                  </div>
                </div>
              </label>

<label class="role-option" data-role="farmer">
                <input type="radio" name="loginRole" value="farmer">
                <div class="role-option-inner">
                  <div class="role-icon">
                    <i class="fa-solid fa-wheat-awn"></i>
                  </div>
                  <div class="role-meta">
                    <span class="role-title">Farmer</span>
                    <span class="role-subtitle">Manage harvests & supply</span>
                  </div>
                  <div class="role-check-indicator">
                    <i class="fa-solid fa-check"></i>
                  </div>
                </div>
              </label>
            </div>
          </div>

<div class="auth-form-group">
            <label for="loginEmail" class="auth-label">Email address</label>
            <div class="auth-input-wrapper">
              <input 
                type="email" 
                id="loginEmail" 
                name="email" 
                class="auth-input" 
                placeholder="Enter your email" 
                required 
                autocomplete="email"
              >
            </div>
          </div>

<div class="auth-form-group">
            <div class="auth-label-row">
              <label for="loginPassword" class="auth-label">Password</label>
              <a href="404.html" class="auth-forgot-link">forgot password?</a>
            </div>
            <div class="auth-input-wrapper has-toggle">
              <input 
                type="password" 
                id="loginPassword" 
                name="password" 
                class="auth-input" 
                placeholder="Enter your password" 
                required 
                autocomplete="current-password"
              >
              <button type="button" class="auth-pwd-toggle" id="loginPwdToggle" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye" id="loginPwdIcon"></i>
              </button>
            </div>
          </div>

<div class="auth-checkbox-row">
            <input type="checkbox" id="remember30Days" name="remember">
            <label for="remember30Days" class="auth-checkbox-label">Remember for 30 days</label>
          </div>

<button type="submit" class="btn-auth-submit" id="loginSubmitBtn">
            <span>Login</span>
          </button>

<div class="auth-divider">
            <span>Or continue with</span>
          </div>

<div class="auth-social-row">

<a href="404.html" class="btn-social-auth" id="googleLoginBtn" aria-label="Sign in with Google">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Google</span>
            </a>

<a href="404.html" class="btn-social-auth" id="facebookLoginBtn" aria-label="Sign in with Facebook">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="#1877F2">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              <span>Facebook</span>
            </a>

</div>

<p class="auth-switch-text">
            Don't have an account? <a href="signup.html" class="auth-switch-link">Sign Up</a>
          </p>

</form>

</section>

<aside class="auth-image-column" aria-label="Organic harvest display">
        <div class="auth-image-card">
          <img src="./assets/auth-login-bg.webp" alt="Freshly harvested organic vegetables on burlap" class="auth-feature-img">
        </div>
      </aside>

</div>
  </main>

<div class="auth-success-toast" id="loginSuccessToast">
    <div class="toast-icon"><i class="fa-solid fa-check"></i></div>
    <span id="loginToastMsg">Login successful! Redirecting to Dashboard...</span>
    <div class="toast-spinner"></div>
  </div>

<div class="toast-container" id="toastContainer"></div>

<script src="script.js"></script>
  <script>

const roleOptions = document.querySelectorAll('#loginRoleSelector .role-option');
    roleOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        roleOptions.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        const radio = opt.querySelector('input[type="radio"]');
        if (radio) radio.checked = true;
      });
    });

const loginPwdToggle = document.getElementById('loginPwdToggle');
    const loginPassword = document.getElementById('loginPassword');
    const loginPwdIcon = document.getElementById('loginPwdIcon');
    if (loginPwdToggle && loginPassword) {
      loginPwdToggle.addEventListener('click', (e) => {
        e.preventDefault();
        const isPassword = loginPassword.type === 'password';
        loginPassword.type = isPassword ? 'text' : 'password';
        if (loginPwdIcon) {
          loginPwdIcon.classList.toggle('fa-eye', !isPassword);
          loginPwdIcon.classList.toggle('fa-eye-slash', isPassword);
        }
      });
    }

let loginRedirectTimer = null;
    const loginFormEl = document.getElementById('loginForm');
    if (window.OrganicValidation && loginFormEl) {
      window.OrganicValidation.setupFormValidation(loginFormEl, {
        onValidSubmit: (form) => {
          const submitBtn = document.getElementById('loginSubmitBtn');
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Signing in...</span>';
          }

const selectedRole = document.querySelector('input[name="loginRole"]:checked')?.value || 'customer';
          const targetUrl = selectedRole === 'farmer' ? 'farmer-dashboard.html' : 'customer-dashboard.html';
          const roleName = selectedRole === 'farmer' ? 'Farmer Portal' : 'Customer Dashboard';

const emailInput = document.getElementById('loginEmail');
          const emailVal = emailInput ? emailInput.value.trim() : '';
          if (emailVal) {
            localStorage.setItem('organic_user_email', emailVal);
            const username = emailVal.split('@')[0];
            localStorage.setItem('organic_user_name', username);
          }

const toast = document.getElementById('loginSuccessToast');
          const toastMsg = document.getElementById('loginToastMsg');
          if (toastMsg) {
            toastMsg.textContent = `Login successful! Redirecting to ${roleName}...`;
          }
          if (toast) {
            toast.classList.add('show');
          }

loginRedirectTimer = setTimeout(() => {
            window.location.href = targetUrl;
          }, 1200);
        }
      });
    }

function resetLoginFormState() {
      if (loginRedirectTimer) {
        clearTimeout(loginRedirectTimer);
        loginRedirectTimer = null;
      }
      const submitBtn = document.getElementById('loginSubmitBtn');
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Login</span>';
      }
      const toast = document.getElementById('loginSuccessToast');
      if (toast) {
        toast.classList.remove('show');
      }
    }

window.addEventListener('pageshow', resetLoginFormState);
    window.addEventListener('pagehide', resetLoginFormState);
  </script>
</body>
</html>
